<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique | Sapres Sarl</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .page-header {
        background-color: var(--color-secondary);
        color: white;
        padding: 4rem 0;
        text-align: center;
      }
      .page-header h1 {
        color: white;
        margin-bottom: 1rem;
      }
      .product-card {
        background: white;
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--color-border);
        transition: var(--transition);
        display: flex;
        flex-direction: column;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
        border-color: var(--color-primary);
      }
      .product-image {
        position: relative;
        height: 200px;
        overflow: hidden;
      }
      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }
      .product-card:hover .product-image img {
        transform: scale(1.05);
      }
      .product-category {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: var(--color-primary);
        color: white;
        padding: 0.25rem 0.75rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .product-content {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .product-content h3 {
        font-size: 1.125rem;
        margin-bottom: 0.5rem;
      }
      .product-content p {
        color: var(--color-text-light);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        flex-grow: 1;
      }
      .product-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--color-border);
        padding-top: 1rem;
      }
      .product-price {
        font-weight: 700;
        font-size: 1.25rem;
        color: var(--color-text);
      }
      .btn-sm {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <a href="/" class="logo">
          <i data-lucide="sun-medium" style="color: var(--color-primary)"></i>
          Sapres<span>Sarl</span>
        </a>
        <nav class="nav-links">
          <a href="/">Accueil</a>
          <a href="/about.html">À propos</a>
          <a href="/services.html">Services</a>
          <a href="/shop.html" class="active">Boutique</a>
          <a href="/contact.html">Contact</a>
        </nav>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <a href="/cart.html" class="cart-icon">
            <i data-lucide="shopping-cart"></i>
            <span class="cart-count" id="global-cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <div class="page-header">
      <div class="container">
        <h1>Notre Boutique en Ligne</h1>
        <p>Découvrez nos équipements solaires et de sécurité de haute qualité.</p>
      </div>
    </div>

    <section class="section section-bg">
      <div class="container">
        <div class="grid-3" id="shop-grid">
          <!-- Products will be injected here by shop.js -->
        </div>
      </div>
    </section>

    <!-- Init Lucide Icons -->
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="/shop.js"></script>
  </body>
</html>
